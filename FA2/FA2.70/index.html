<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
</head>
<body>
    <h1>Employee Management</h1>

    <div>
        <label for="nameInput">Name:</label>
        <input type="text" id="nameInput">
    </div>

    <div>
        <label for="ageInput">Age:</label>
        <input type="number" id="ageInput" min="1" step="1">
    </div>

    <div>
        <label for="positionInput">Position:</label>
        <input type="text" id="positionInput">
    </div>

    <div>
        <label for="typeInput">Employee Type:</label>

        <select id="typeInput">
            <option value="technical">Technical Staff</option>
            <option value="administrative">
                Administrative Staff
            </option>
        </select>
    </div>

    <div>
        <label for="detailInput" id="detailLabel">
            Technical Skill:
        </label>
        <input type="text" id="detailInput">
    </div>

    <button type="button" id="addEmployeeButton">
        Add Employee
    </button>

    <h2>Employee List</h2>
    <div id="employeeList"></div>

    <script src="./script.js"></script>
</body>
</html>
