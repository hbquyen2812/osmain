<!DOCTYPE html>

<body>
    <script>
        const capitalizeWords = (text) => {
            return text.toLowerCase().trim().split(/\s+/).map((word) => {
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(" ");
        };

        console.log(capitalizeWords("js string exercises"));
    </script>
</body>
</html>
