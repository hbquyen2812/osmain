<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>FA5.20 - Bài 7</title>
</head>
<body>
    <script>
        const repeatString = (text, n) => {
            return Array.from({ length: n }, () => text).join(" ");
        };

        console.log(repeatString("Ha!", 1));
        console.log(repeatString("Ha!", 2));
        console.log(repeatString("Ha!", 3));
    </script>
</body>
</html>
