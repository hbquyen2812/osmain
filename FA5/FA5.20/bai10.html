<!DOCTYPE html>

    <title>FA5.20 - Bài 10</title>
</head>
<body>
    <script>
        const replaceRight = (text, replacement) => {
            const keepLength = Math.max(0, text.length - replacement.length);

            return text.slice(0, keepLength) + replacement;
        };

        console.log(replaceRight("0000", "123"));
    </script>
</body>
