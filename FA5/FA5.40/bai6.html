<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>FA5.40 - Bài 6</title>
</head>
<body>
    <script>
        const isUppercase = (text, n) => {
            const character = text[n];

            if (character === undefined) {
                return false;
            }

            return character === character.toUpperCase() &&
                   character !== character.toLowerCase();
        };

        console.log(isUppercase("JsSTRING EXERCISES", 1));
        console.log(isUppercase("JsSTRING EXERCISES", 2));
    </script>
</body>
</html>
