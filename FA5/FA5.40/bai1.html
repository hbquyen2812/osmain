<body>
    <script>
        const countCharacter = (text, character) => {
            return [...text.toLowerCase()].filter(
                (value) => value === character.toLowerCase()
            ).length;
        };

        console.log(countCharacter("DCresource: JavaScript Exercises", "e"));
    </script>
