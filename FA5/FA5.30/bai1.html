<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>FA5.30 - Bài 1</title>
</head>
<body>
    <script>
        const createRange = (x, y) => {
            return Array.from(
                { length: y - x + 1 },
                (_, index) => x + index
            );
        };

        console.log(createRange(4, 7));
        console.log(createRange(-4, 7));
    </script>
</body>
</html>
