<body>
    <script>
        const mergeUnique = (array1, array2) => {
            return [...new Set([...array1, ...array2])];
        };

        console.log(mergeUnique([1, 2, 3], [100, 2, 1, 10]));
        console.log(mergeUnique([1, 2, 3], [1, 2, 3]));
    </script>
</body>
