<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>FA5.30 - Bài 6</title>
</head>
<body>
    <script>
        const sumArrays = (array1, array2) => {
            const maxLength = Math.max(array1.length, array2.length);

            return Array.from({ length: maxLength }, (_, index) => {
                const value1 = index < array1.length ? array1[index] : 0;
                const value2 = index < array2.length ? array2[index] : 0;

                return value1 + value2;
            });
        };

        console.log(sumArrays([1, 0, 2, 3, 4], [3, 5, 6, 7, 8, 13]));
        console.log(sumArrays([1, 2, 3], [1, 2, 3, 4, 5]));
    </script>
</body>
</html>
