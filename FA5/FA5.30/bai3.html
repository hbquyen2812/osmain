<body>
    <script>
        const countOccurrences = (array, n) => {
            return array.filter((value) => value === n).length;
        };

        const numbers = [1, 2, 1, 4, 5, 1, 1, 3, 1];

        console.log(countOccurrences(numbers, 1));
        console.log(countOccurrences(numbers, 2));
    </script>
