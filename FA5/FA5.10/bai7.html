<body>
    <script>
        const removeElement = (array, n) => {
            return array.filter((value) => value !== n);
        };

        console.log(removeElement([2, 5, 9, 6], 5));
        console.log(removeElement([2, 9, 6], 5));
        console.log(removeElement([2, 5, 9, 6], 6));
    </script>
</body>
