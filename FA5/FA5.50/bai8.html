<body>
    <script>
        const isNaturalNumber = (number) => {
            return Number.isInteger(number) && number >= 0;
        };

        console.log(isNaturalNumber(-15));
        console.log(isNaturalNumber(1));
        console.log(isNaturalNumber(1.2));
    </script>
</body>
