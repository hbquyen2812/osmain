<!DOCTYPE html>

<head>

    <title>FA5.50 - Bài 5</title>
</head>
<body>
    <script>
        const getNextMultipleOfFive = (number) => {
            return Math.floor(number / 5) * 5 + 5;
        };

        console.log(getNextMultipleOfFive(32));
        console.log(getNextMultipleOfFive(137));
    </script>
</body>
