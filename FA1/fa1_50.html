<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rest Parameters và Spread Operator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #result {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Rest Parameters và Spread Operator trong JavaScript</h1>
  <button onclick="calculateSum()">Tính tổng các số</button>
  <button onclick="combineArrays()">Kết hợp mảng</button>
  <div id="result"></div>

  <script>
    function calculateSum() {
      const sum = (...numbers) => numbers.reduce((total, num) => total + num, 0);
      const result = sum(1, 2, 3, 4, 5);
      document.getElementById('result').innerHTML =
        `<p>Tổng các số [1, 2, 3, 4, 5]: ${result}</p>`;
    }

    function combineArrays() {
      const array1 = [1, 2, 3];
      const array2 = [4, 5, 6];
      const combinedArray = [...array1, ...array2];
      document.getElementById('result').innerHTML =
        `<p>Kết hợp mảng [1, 2, 3] và [4, 5, 6]: [${combinedArray.join(', ')}]</p>`;
    }
  </script>
</body>
</html>
